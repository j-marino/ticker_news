<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$tackz — Register</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/retro-theme.css">
    <style>
        .auth-box p {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 16px;
        }
        .auth-box p a {
            color: var(--green);
            text-decoration: none;
            font-family: var(--mono);
        }

        .pw-rules {
            margin: 4px 0 10px;
            padding: 0;
            list-style: none;
        }

        .pw-rules li {
            font-size: 11px;
            font-family: var(--mono);
            color: var(--text-muted);
            padding: 2px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .pw-rules li::before {
            content: '○';
            font-size: 8px;
            transition: all 0.2s;
        }

        .pw-rules li.pass {
            color: var(--green);
        }

        .pw-rules li.pass::before {
            content: '●';
            color: var(--green);
        }

        .pw-rules li.fail {
            color: var(--red);
        }

        .pw-rules li.fail::before {
            content: '○';
            color: var(--red);
        }

        .match-msg {
            font-size: 11px;
            font-family: var(--mono);
            margin-bottom: 8px;
            height: 16px;
        }

        .match-ok  { color: var(--green); }
        .match-bad { color: var(--red); }
    </style>
</head>
<body>
<div class="auth-page">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">◈ retro</button>
    <div class="auth-logo">$tackz</div>
    <div class="auth-tagline">// tired of FOMO'ing on missed opportunities?</div>

    <div class="auth-forms">
        <div class="auth-box">
            <h2>Register</h2>
            {% if error %}
                <div class="auth-error">{{ error }}</div>
            {% endif %}
            <form action="/register" method="post" id="registerForm">
                <input type="text" name="username" placeholder="username" autocomplete="username" required>
                <input type="email" name="email" placeholder="email" autocomplete="email" required>
                <input type="password" name="password" id="password" placeholder="password" autocomplete="new-password" required>

                <ul class="pw-rules" id="pwRules">
                    <li id="rule-length">At least 8 characters</li>
                    <li id="rule-upper">At least 1 uppercase letter</li>
                    <li id="rule-symbol">At least 1 symbol (!@#$%^&*)</li>
                </ul>

                <input type="password" id="confirmPassword" placeholder="confirm password" autocomplete="new-password" required>
                <div class="match-msg" id="matchMsg"></div>

                <button type="submit" class="auth-btn" id="submitBtn" disabled style="opacity:0.4; cursor:not-allowed;">REGISTER</button>
            </form>
            <p>already a member? <a href="/login">login here</a></p>
        </div>
    </div>

    <p class="auth-disclaimer">⚠ not financial advice &nbsp;|&nbsp; for informational purposes only</p>
</div>

<script>
    const password = document.getElementById('password');
    const confirm  = document.getElementById('confirmPassword');
    const matchMsg = document.getElementById('matchMsg');
    const submitBtn = document.getElementById('submitBtn');

    const rules = {
        length: { el: document.getElementById('rule-length'), test: v => v.length >= 8 },
        upper:  { el: document.getElementById('rule-upper'),  test: v => /[A-Z]/.test(v) },
        symbol: { el: document.getElementById('rule-symbol'), test: v => /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(v) }
    };

    function validate() {
        let allRulesPassed = true;

        for (const [key, rule] of Object.entries(rules)) {
            const passes = rule.test(password.value);
            rule.el.className = password.value.length === 0 ? '' : passes ? 'pass' : 'fail';
            if (!passes) allRulesPassed = false;
        }

        const matches = confirm.value.length > 0 && password.value === confirm.value;
        const mismatch = confirm.value.length > 0 && password.value !== confirm.value;

        if (matches) {
            matchMsg.textContent = '✓ passwords match';
            matchMsg.className = 'match-msg match-ok';
        } else if (mismatch) {
            matchMsg.textContent = '✗ passwords do not match';
            matchMsg.className = 'match-msg match-bad';
        } else {
            matchMsg.textContent = '';
            matchMsg.className = 'match-msg';
        }

        const ready = allRulesPassed && matches;
        submitBtn.disabled = !ready;
        submitBtn.style.opacity = ready ? '1' : '0.4';
        submitBtn.style.cursor = ready ? 'pointer' : 'not-allowed';
    }

    password.addEventListener('input', validate);
    confirm.addEventListener('input', validate);

(function() {
    const saved = localStorage.getItem('stackz-theme');
    if (saved === 'retro') document.body.classList.add('retro');
})();

function toggleTheme() {
    const isRetro = document.body.classList.toggle('retro');
    document.getElementById('themeToggle').textContent = isRetro ? '◈ futuristic' : '◈ retro';
    document.getElementById('themeToggle').style.color = '';
    localStorage.setItem('stackz-theme', isRetro ? 'retro' : 'default');
}

// set button text correctly on load
window.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('themeToggle');
    if (btn && document.body.classList.contains('retro')) {
        btn.textContent = '◈ futuristic';
    }
});
</script>

</body>
</html>
