<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$tackz — Verify Email</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="verify-page">
    <div class="verify-box">
        <div class="auth-logo" style="font-size:20px; margin-bottom:16px;">$tackz</div>
        <h2>Check your email</h2>
        <p>Enter the 6-digit code we sent you. It expires in 10 minutes.</p>

        {% if error %}
            <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form action="/verify" method="post">
            <input type="number" name="inputted_code" placeholder="000000" min="100000" max="999999" required>
            <button type="submit" class="auth-btn">VERIFY</button>
        </form>
    </div>
</div>

</body>
</html>
