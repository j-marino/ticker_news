<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f0f0f;
            color: white;
        }
        .forms-container { display: flex; gap: 40px; }
        .info-container {
            background: #1a1a1a;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #333;
            width: 280px;
        }
        h2 { text-align: center; margin-bottom: 16px; }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00c853;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { background-color: #00e676; }
        .error { color: #ff5252; text-align: center; margin-bottom: 10px; font-size: 14px; }
        .disclaimer { font-size: 11px; color: #666; text-align: center; margin-top: 24px; max-width: 600px; }
    </style>
</head>
<body>
    <h1 style="margin-bottom: 32px;">$tackz 📈</h1>
    <div class="forms-container">
        <div class="info-container">
            <h2>Login</h2>
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
            <form action="/login" method="post">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
        <div class="info-container">
            <h2>Register</h2>
            <form action="/register" method="post">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
        </div>
    </div>
    <p class="disclaimer">big bucks time</p>
</body>
</html>
